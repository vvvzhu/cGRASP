[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "cgrasp"
version = "0.1.4"
description = "Experimental cGRASP (constrained GRASP) over CoAP"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "The cGRASP contributors" }]
keywords = ["grasp", "cgrasp", "coap", "anima", "iot", "autonomic networking"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Telecommunications Industry",
  "License :: OSI Approved :: BSD License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Internet",
  "Topic :: System :: Networking",
]
dependencies = [
  "aiocoap==0.4.17",
  "cbor2>=5.4,<6",
  "netifaces>=0.11,<1; platform_system != 'Windows'",
]

[project.optional-dependencies]
quads = ["cryptography>=42,<51"]
test = [
  "pytest>=7,<9",
  "pytest-timeout>=2,<3",
  "pytest-cov>=5,<7",
]
dev = [
  "cgrasp[test]",
  "cryptography>=42,<51",
  "dpkt>=1.9,<2",
  "pyflakes>=3,<5",
  "ruff>=0.6",
]

[tool.setuptools]
packages = ["cgrasp"]
package-dir = { "cgrasp" = "src/cgrasp", "" = "." }
py-modules = [
  "acp",
  "grasp",
  "graspi",
  "cgraspi",
]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]
markers = [
  "network: requires local IPv6 UDP sockets",
  "multicast: requires an IPv6 link-local multicast-capable interface",
  "relay: requires root network namespace and packet-capture privileges",
]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]

[tool.coverage.run]
source = ["src/cgrasp"]
omit = [
  "*/cgrasp/acp.py",
  "*/cgrasp/grasp.py",
  "tests/*",
  "scripts/*",
]

[tool.coverage.report]
fail_under = 35
show_missing = true
skip_covered = true
